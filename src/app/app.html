<div class="app-shell">
  <header class="app-header">
    <a class="app-brand" routerLink="/">
      <img
        src="/poko/logo_poko.png"
        alt="Poko"
        class="app-logo"
      />

      <span class="app-brand-name">
        Poko
      </span>
    </a>

    <div class="app-header-actions">
      <span class="app-header-month">
        Octobre 2026
      </span>

      <button
        type="button"
        class="app-theme-toggle"
        aria-label="Changer de thème"
        (click)="themeService.toggleTheme()"
      >
        @if (themeService.isDark()) {
          <svg
            class="app-theme-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2"></path>
            <path d="M12 20v2"></path>
            <path d="m4.93 4.93 1.41 1.41"></path>
            <path d="m17.66 17.66 1.41 1.41"></path>
            <path d="M2 12h2"></path>
            <path d="M20 12h2"></path>
            <path d="m6.34 17.66-1.41 1.41"></path>
            <path d="m19.07 4.93-1.41 1.41"></path>
          </svg>
        } @else {
          <svg
            class="app-theme-icon"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        }
      </button>
    </div>
  </header>

  <nav class="app-navigation">
    <a
      routerLink="/budget"
      routerLinkActive="app-navigation-link--active"
      [routerLinkActiveOptions]="{ exact: true }"
      class="app-navigation-link"
    >
      <svg class="app-navigation-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="5" width="18" height="14" rx="3"></rect>
        <path d="M16 12h2"></path>
      </svg>
      <span>Budget</span>
    </a>

    <a
      routerLink="/revenus"
      routerLinkActive="app-navigation-link--active"
      class="app-navigation-link"
    >
      <svg class="app-navigation-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M12 2v20"></path>
        <path d="M17 5H9.5a3.5 3.5 0 0 0 0 7H14a3.5 3.5 0 0 1 0 7H6"></path>
      </svg>
      <span>Revenus</span>
    </a>

    <a
      routerLink="/depenses"
      routerLinkActive="app-navigation-link--active"
      class="app-navigation-link"
    >
      <svg class="app-navigation-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="5" y="3" width="14" height="18" rx="2"></rect>
        <path d="M8 7h8"></path>
        <path d="M8 11h8"></path>
        <path d="M8 15h5"></path>
      </svg>
      <span>Dépenses</span>
    </a>

    <a
      routerLink="/charges"
      routerLinkActive="app-navigation-link--active"
      class="app-navigation-link"
    >
      <svg class="app-navigation-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="5" y="3" width="14" height="18" rx="2"></rect>
        <path d="M8 7h8"></path>
        <path d="M8 11h8"></path>
        <path d="M8 15h8"></path>
      </svg>
      <span>Charges</span>
    </a>

    <a
      routerLink="/synthese"
      routerLinkActive="app-navigation-link--active"
      class="app-navigation-link"
    >
      <svg class="app-navigation-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 19V5"></path>
        <path d="M4 19h16"></path>
        <path d="M8 16v-4"></path>
        <path d="M12 16V8"></path>
        <path d="M16 16V5"></path>
      </svg>
      <span>Synthèse</span>
    </a>

    <a
      routerLink="/mois"
      routerLinkActive="app-navigation-link--active"
      class="app-navigation-link"
    >
      <svg class="app-navigation-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="4" width="18" height="17" rx="2"></rect>
        <path d="M16 2v4"></path>
        <path d="M8 2v4"></path>
        <path d="M3 10h18"></path>
      </svg>
      <span>Mes mois</span>
    </a>

    <a
      routerLink="/objectifs"
      routerLinkActive="app-navigation-link--active"
      class="app-navigation-link"
    >
      <svg class="app-navigation-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="9"></circle>
        <circle cx="12" cy="12" r="5"></circle>
        <circle cx="12" cy="12" r="1"></circle>
      </svg>
      <span>Objectifs</span>
    </a>

    <a
      routerLink="/bons-plans"
      routerLinkActive="app-navigation-link--active"
      class="app-navigation-link"
    >
      <svg class="app-navigation-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="5" width="18" height="14" rx="3"></rect>
        <path d="M8 12h8"></path>
        <path d="M12 8v8"></path>
      </svg>
      <span>Bons plans</span>
    </a>
  </nav>

  <main class="app-content">
    <router-outlet />
  </main>
</div>
